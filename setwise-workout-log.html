<title>Setwise Workout Log — Mobile</title>
<style>
:root {

  --artifact-text-secondary: #9aa0ad;
  --artifact-text-highlight: #14213d;
  --artifact-positive-background: #0e2a1d;
  --artifact-positive-text: #c8f5da;
  --artifact-positive: #46d39a;
  --artifact-negative: #ff6b6b;
  --artifact-warning: #f2cb6b;

}
html[data-theme='dark'] {
  --artifact-background: #0a0b0e;
  --artifact-background-light: #121419;
  --artifact-background-mid: #181b22;
  --artifact-border-light: #23262e;
  --artifact-border-dark: #343844;
  --artifact-primary-brand: #6a92ff;
  --artifact-primary-highlight: #f5f7fb;
  --artifact-primary-hover: #88a8ff;
  --artifact-selected: #1a2030;
  --artifact-text-primary: #eef0f4;
  --artifact-text-secondary: #9aa0ad;
  --artifact-text-highlight: #14213d;
  --artifact-positive-background: #0e2a1d;
  --artifact-positive-text: #c8f5da;
  --artifact-positive: #46d39a;
  --artifact-negative: #ff6b6b;
  --artifact-warning: #f2cb6b;
  --artifact-warning-bg: #302715;
  --artifact-surface: #0f1116;
  --artifact-hover: #171a20;
  --artifact-shadow: none;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--artifact-background); color:var(--artifact-text-primary); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:15px; font-weight:400; line-height:1.6; letter-spacing:-.005em; }
button,input,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--artifact-primary-brand); outline-offset:2px; }
.app-shell { min-height:100vh; padding-bottom:88px; }
.topbar { height:70px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 clamp(18px,4vw,56px); border-bottom:1px solid var(--artifact-border-light); background:var(--artifact-background); }
.brand { display:flex; align-items:center; gap:11px; font-size:18px; font-weight:750; letter-spacing:-.04em; }
.brand-mark { width:31px; height:31px; border-radius:10px; display:grid; place-items:center; background:var(--artifact-primary-brand); color:var(--artifact-background); font-size:17px; font-weight:850; }
button.primary, .primary { border:0; background:var(--artifact-primary-brand); color:var(--artifact-background); border-radius:10px; font-weight:700; padding:11px 16px; transition:background .16s ease,transform .16s ease; }
button.primary:hover { background:var(--artifact-primary-hover); transform:translateY(-1px); }
button.secondary { border:1px solid var(--artifact-border-dark); color:var(--artifact-text-primary); background:var(--artifact-surface); border-radius:9px; padding:9px 13px; font-weight:650; }
button.secondary:hover { background:var(--artifact-hover); }
button.ghost { border:0; color:var(--artifact-text-secondary); background:transparent; border-radius:8px; padding:7px 9px; }
button.ghost:hover { background:var(--artifact-hover); color:var(--artifact-text-primary); }
button.danger { color:var(--artifact-negative); }
.icon-btn { min-width:38px; min-height:38px; }
.layout { max-width:1160px; margin:0 auto; padding:30px clamp(16px,4vw,40px) 54px; }
.welcome { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; }
.eyebrow,.label,.section-kicker { text-transform:uppercase; letter-spacing:.12em; font-family:"SF Mono","Cascadia Code",Consolas,monospace; font-size:10px; font-weight:700; color:var(--artifact-text-secondary); }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:clamp(30px,5vw,48px); letter-spacing:-.055em; line-height:1.05; margin:9px 0 8px; }
h2 { font-size:22px; letter-spacing:-.035em; line-height:1.2; margin:0; }
h3 { font-size:16px; letter-spacing:-.025em; margin:0; }
.subtle { color:var(--artifact-text-secondary); }
.welcome p { margin:0; color:var(--artifact-text-secondary); }
.content-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(255px,.85fr); gap:22px; align-items:start; }
.stack { display:grid; gap:18px; }
.panel { border:1px solid var(--artifact-border-light); background:var(--artifact-surface); border-radius:16px; padding:21px; }
.panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:17px; }
.panel-header .subtle { font-size:13px; margin:4px 0 0; }
.stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:20px; }
.stat { border:1px solid var(--artifact-border-light); background:var(--artifact-background-light); border-radius:12px; padding:13px 14px; min-width:0; }
.stat strong { display:block; font-size:24px; font-weight:750; letter-spacing:-.05em; font-variant-numeric:tabular-nums; line-height:1.15; }
.stat span { display:block; color:var(--artifact-text-secondary); font-size:12px; margin-top:5px; }
.plan-list { display:grid; gap:10px; }
.plan-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px; border:1px solid var(--artifact-border-light); border-radius:12px; transition:background .15s ease; }
.plan-row:hover { background:var(--artifact-hover); }
.plan-info { min-width:0; }
.plan-info p { color:var(--artifact-text-secondary); font-size:12px; margin:4px 0 0; }
.plan-actions { display:flex; align-items:center; gap:6px; }
.empty { text-align:center; padding:34px 18px; border:1px dashed var(--artifact-border-dark); border-radius:12px; }
.empty-mark { width:43px; height:43px; border-radius:14px; margin:0 auto 12px; display:grid; place-items:center; background:var(--artifact-selected); color:var(--artifact-primary-brand); font-size:21px; }
.empty h3 { margin-bottom:6px; }
.empty p { margin:0 auto 15px; color:var(--artifact-text-secondary); max-width:340px; font-size:13px; }
.session-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding-bottom:16px; border-bottom:1px solid var(--artifact-border-light); margin-bottom:16px; }
.session-title { background:transparent; color:var(--artifact-text-primary); border:0; border-bottom:1px dashed var(--artifact-border-dark); padding:2px 0 4px; max-width:100%; font-size:22px; font-weight:750; letter-spacing:-.04em; }
.timer { border-radius:10px; background:var(--artifact-selected); color:var(--artifact-primary-brand); padding:8px 10px; font-variant-numeric:tabular-nums; font-weight:750; white-space:nowrap; }
.exercise-card { border:1px solid var(--artifact-border-light); border-radius:13px; margin-bottom:13px; overflow:hidden; }
.exercise-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; background:var(--artifact-background-light); }
.exercise-head h3 { font-size:15px; }
.set-list { padding:5px 14px 10px; }
.set-head,.set-row { display:grid; grid-template-columns:42px minmax(72px,1fr) minmax(72px,1fr) 42px; gap:9px; align-items:center; }
.set-head { color:var(--artifact-text-secondary); font-family:Consolas,monospace; text-transform:uppercase; letter-spacing:.08em; font-size:10px; padding:7px 2px 6px; }
.set-row { padding:5px 2px; }
.set-no { color:var(--artifact-text-secondary); font-variant-numeric:tabular-nums; font-size:12px; }
.field { width:100%; border:1px solid var(--artifact-border-light); border-radius:8px; padding:8px 9px; color:var(--artifact-text-primary); background:var(--artifact-background); font-variant-numeric:tabular-nums; }
.field::placeholder { color:var(--artifact-text-secondary); opacity:.8; }
.done-toggle { height:34px; width:34px; border:1px solid var(--artifact-border-dark); border-radius:9px; background:var(--artifact-background); color:var(--artifact-text-secondary); font-weight:800; }
.done-toggle.is-done { border-color:var(--artifact-positive); background:var(--artifact-positive-background); color:var(--artifact-positive); }
.exercise-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:0 14px 12px; }
.add-set { padding:5px 8px!important; font-size:12px!important; }
.exercise-effort { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--artifact-border-light); }
.exercise-effort label { display:block; font-size:13px; font-weight:700; }
.effort-hint { font-size:11px; margin-top:2px; }
.rpe-select { width:100px; flex:0 0 100px; padding-top:8px; padding-bottom:8px; }
.rpe-select:disabled { opacity:.58; cursor:not-allowed; }
.rest-setting { display:inline-flex; align-items:center; gap:6px; color:var(--artifact-text-secondary); font-size:11px; font-weight:650; }
.rest-select { width:auto; flex:0 0 auto; padding:6px 27px 6px 8px; font-size:12px; border-radius:8px; }
.set-count { font-size:11px; }
.add-exercise-bar { display:flex; align-items:center; gap:8px; margin:15px 0; }
.select-field { appearance:none; flex:1; min-width:0; border:1px solid var(--artifact-border-dark); border-radius:9px; background:var(--artifact-background); color:var(--artifact-text-primary); padding:10px 34px 10px 12px; background-image:linear-gradient(45deg,transparent 50%,var(--artifact-text-secondary) 50%),linear-gradient(135deg,var(--artifact-text-secondary) 50%,transparent 50%); background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
.finish-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:15px; border-top:1px solid var(--artifact-border-light); }
.finish-row .subtle { font-size:12px; }
.rest-chip { display:inline-flex; align-items:center; gap:7px; color:var(--artifact-warning); background:var(--artifact-warning-bg); padding:6px 9px; border-radius:8px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.list { display:grid; }
.history-item { padding:15px 0; border-bottom:1px solid var(--artifact-border-light); display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
.history-item:last-child { border-bottom:0; padding-bottom:0; }
.history-item:first-child { padding-top:0; }
.history-item p { color:var(--artifact-text-secondary); font-size:12px; margin:5px 0 0; }
.history-value { text-align:right; white-space:nowrap; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.cardio-form-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.cardio-form-grid label { display:grid; gap:6px; color:var(--artifact-text-secondary); font-size:12px; font-weight:650; }
.cardio-form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:13px; }
.cardio-notes { color:var(--artifact-text-secondary)!important; font-size:12px!important; margin-top:6px!important; }
.history-actions { display:flex; align-items:flex-start; justify-content:flex-end; gap:10px; }
.cardio-other { margin-top:11px; }
.cardio-other label { display:grid; gap:6px; color:var(--artifact-text-secondary); font-size:12px; font-weight:650; }
.history-delete { color:var(--artifact-negative)!important; white-space:nowrap; }
.workout-bottom-actions { display:flex; justify-content:flex-start; padding-top:14px; }
.workout-bottom-actions .back-button { min-width:110px; }
.session-details { margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--artifact-background-light); font-size:12px; }
.session-details ul { margin:4px 0 0; padding-left:18px; color:var(--artifact-text-secondary); }
.record-list { display:grid; gap:0; }
.record-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--artifact-border-light); }
.record-row:last-child { border-bottom:0; }
.record-name { font-weight:650; }
.record-meta { display:block; color:var(--artifact-text-secondary); font-size:12px; margin-top:3px; }
.record-weight { text-align:right; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.record-weight small { font-size:11px; color:var(--artifact-text-secondary); font-weight:500; }
.builder { display:grid; grid-template-columns:1fr; gap:11px; padding:15px; border:1px solid var(--artifact-border-light); border-radius:12px; background:var(--artifact-background-light); margin-bottom:18px; }
.builder-row { display:flex; gap:8px; }
.builder input { min-width:0; flex:1; border:1px solid var(--artifact-border-dark); border-radius:8px; background:var(--artifact-background); color:var(--artifact-text-primary); padding:10px 11px; }
.notice { border:1px solid var(--artifact-border-light); background:var(--artifact-background-light); border-radius:11px; padding:12px 14px; color:var(--artifact-text-secondary); font-size:12px; }
.utility-actions { display:flex; flex-wrap:wrap; gap:8px; }
.export-panel { margin-top:14px; }
.export-layout { display:grid; grid-template-columns:minmax(175px,.75fr) minmax(260px,1.25fr) auto; align-items:end; gap:12px; }
.export-layout > label,.export-date { display:grid; gap:6px; color:var(--artifact-text-secondary); font-size:12px; font-weight:650; }
.export-dates { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.export-layout > button { white-space:nowrap; }
.export-caption { margin:12px 0 0; font-size:12px; }

.view-title { margin-bottom:22px; }
.view-title p { margin:7px 0 0; color:var(--artifact-text-secondary); }
.nav { display:flex; align-items:center; gap:5px; }
.nav button { border:0; background:transparent; color:var(--artifact-text-secondary); border-radius:9px; padding:9px 13px; font-weight:650; }
.nav button:hover { background:var(--artifact-hover); color:var(--artifact-text-primary); }
.nav button.active { background:var(--artifact-selected); color:var(--artifact-primary-brand); }
.mobile-nav { display:none; }
.toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--artifact-primary-highlight); color:var(--artifact-background); padding:10px 15px; border-radius:10px; box-shadow:var(--artifact-shadow); font-size:13px; z-index:20; transition:all .2s ease; }
.toast.show { opacity:1; transform:translate(-50%,0); }
.hidden { display:none!important; }
hr.rule { border:0; border-top:1px solid var(--artifact-border-light); margin:17px 0; }

/* Phone-first enhancements */
@media (max-width:760px) {
  html { min-height:100%; background:var(--artifact-background); -webkit-text-size-adjust:100%; }
  body { min-height:100%; padding-bottom:env(safe-area-inset-bottom); overscroll-behavior-y:contain; }
  .app-shell { padding-bottom:calc(82px + env(safe-area-inset-bottom)); }
  .topbar { padding-top:env(safe-area-inset-top); height:calc(62px + env(safe-area-inset-top)); }
  .brand-mark { width:29px; height:29px; }
  .layout { padding-left:14px; padding-right:14px; }
  input, select, button { font-size:16px; } /* prevents iOS input zoom */
  button.primary, button.secondary { min-height:44px; }
  button.ghost { min-height:40px; }
  .panel-header { align-items:flex-start; }
  .panel-header > .ghost { margin-top:-5px; }
  .plan-row { align-items:stretch; flex-direction:column; padding:13px; }
  .plan-actions { width:100%; }
  .plan-actions .primary { flex:1; }
  .plan-actions .icon-btn { flex:0 0 44px; }
  .exercise-card { border-radius:12px; }
  .exercise-head { position:sticky; top:0; z-index:2; }
  .set-head { font-size:9px; }
  .set-row { min-height:46px; }
  .field { min-height:42px; }
  .done-toggle { width:42px; height:42px; border-radius:11px; }
  .exercise-effort { align-items:flex-start; flex-direction:column; gap:8px; }
  .rpe-select { width:100%; flex-basis:auto; }
  .exercise-footer { gap:10px; }
  .add-set { min-height:40px!important; }
  .rest-setting { margin-left:auto; }
  .add-exercise-bar { align-items:stretch; flex-direction:column; }
  .add-exercise-bar .secondary { width:100%; }
  .custom-exercise-bar { margin-top:0; }
  .finish-row { position:sticky; bottom:calc(68px + env(safe-area-inset-bottom)); z-index:4; margin:0 -17px -17px; padding:12px 17px max(14px, env(safe-area-inset-bottom)); background:var(--artifact-surface); border-top:1px solid var(--artifact-border-light); }
  .finish-row .primary { width:100%; }
  .mobile-nav { padding-bottom:max(8px,env(safe-area-inset-bottom)); }
  .mobile-nav button { min-height:49px; }
  .toast { bottom:calc(78px + env(safe-area-inset-bottom)); max-width:calc(100vw - 28px); text-align:center; }
  .history-item { flex-direction:column; gap:9px; }
  .history-actions { width:100%; align-items:center; justify-content:space-between; }
  .history-value { text-align:left; }
  .session-details { width:100%; }
}
@media (max-width:380px) {
  .stats { grid-template-columns:1fr; }
  .stat { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .stat span { margin-top:0; text-align:right; }
}

@media (max-width:760px) {
 .topbar { height:62px; padding:0 16px; }
 .nav { display:none; }
 .layout { padding:23px 15px 36px; }
 .welcome { align-items:flex-start; flex-direction:column; gap:14px; margin-bottom:20px; }
 .welcome .primary { width:100%; }
 .content-grid { grid-template-columns:1fr; gap:14px; }
 .export-layout { grid-template-columns:1fr; gap:10px; }
 .export-dates { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .export-layout > button { width:100%; }

 .panel { padding:17px; border-radius:14px; }
 .stats { gap:7px; }
 .stat { padding:11px 10px; }
 .stat strong { font-size:21px; }
 .mobile-nav { display:grid; grid-template-columns:repeat(5,1fr); position:fixed; z-index:10; bottom:0; left:0; right:0; padding:7px 8px max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--artifact-border-light); background:var(--artifact-background); }
 .mobile-nav button { border:0; background:transparent; color:var(--artifact-text-secondary); padding:7px 4px; font-size:11px; font-weight:650; display:grid; justify-items:center; gap:3px; }
 .mobile-nav button.active { color:var(--artifact-primary-brand); }
 .mobile-nav .nav-icon { font-size:17px; line-height:1; }
 .top-actions .secondary { display:none; }
 .history-item { align-items:flex-start; }
 .history-actions { width:100%; justify-content:space-between; }
 .cardio-form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .cardio-form-actions { justify-content:stretch; }
 .cardio-form-actions button { width:100%; }
 .builder-row { flex-direction:column; }
 .finish-row { align-items:flex-start; flex-direction:column; }
 .finish-row button { width:100%; }
}
@media (max-width:380px) {
 .set-head,.set-row { grid-template-columns:31px minmax(58px,1fr) minmax(58px,1fr) 36px; gap:6px; }
 .field { padding:8px 6px; }
 .set-list { padding-left:10px; padding-right:10px; }
 .exercise-head { padding:12px 10px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
@media print {
  @page { size: auto !important; }
  body { margin:0; padding:0.4in 0.6in; background:var(--artifact-background); print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  .container,.dashboard,.shell,main,.layout { max-width:100%!important; width:100%!important; }
  [style*="position:sticky"],[style*="position: sticky"],.topbar,.mobile-nav { position:static!important; }
  section,[class*="section"],.header { break-inside:avoid; margin-bottom:20px!important; }
  [class*="card"],[class*="Card"],.panel { break-inside:avoid; padding:18px!important; box-shadow:none!important; border:1px solid var(--artifact-border-light); }
  [class*="grid"],[class*="row"] { gap:10px!important; margin-bottom:20px!important; }
  [class*="chart"],[class*="Chart"] { break-inside:avoid; height:240px!important; }
  table,thead,.funnel,.heatmap,.list,.goals { break-inside:avoid; }
  [class*="quote-list"],[class*="scroll"],[style*="max-height"],[style*="overflow"] { max-height:none!important; overflow:visible!important; }
  [class*="tab-panel"],[class*="tabpanel"] { display:block!important; }
  [class*="tab-bar"],[class*="tabs"]:not([class*="panel"]) { display:none!important; }
  [class*="fade"],[class*="animate"],[class*="slide"] { opacity:1!important; transform:none!important; }
  *,*::before,*::after { animation:none!important; transition:none!important; }
  button,.interactive-only { display:none!important; }
}

/* Extra mobile usability refinements */
@media (max-width:760px) {
  .topbar { position: sticky; top: 0; z-index: 8; backdrop-filter: blur(12px); }
  .session-top { position: sticky; top: 62px; z-index: 6; background: var(--artifact-surface); padding-top: 12px; }
  .session-title { font-size: 20px; }
  .set-head,.set-row { grid-template-columns: 30px minmax(0,1fr) minmax(0,1fr) 44px; }
  .field { min-width: 0; }
  .done-toggle { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .mobile-nav { backdrop-filter: blur(14px); }
}
@media (max-width:430px) {
  body { font-size:14px; }
  h1 { font-size:32px; }
  h2 { font-size:20px; }
  .panel { padding:14px; }
  .exercise-head h3 { font-size:14px; }
  .set-list { padding-left:6px; padding-right:6px; }
  .set-head { letter-spacing:.04em; }
}

</style>
</head>
<body>
<div class="app-shell" data-glean-id="app-shell">
  <header class="topbar" data-glean-id="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>setwise</span></div>
    <nav class="nav" aria-label="Main navigation" id="desktopNav"></nav>
    <button class="secondary" id="installBtn" type="button" style="display:none" aria-label="Install Setwise">Install</button>
    
  </header>
  <main class="layout" id="screen" data-glean-id="main-view"></main>
  <nav class="mobile-nav" aria-label="Mobile navigation" id="mobileNav"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  const KEY='setwise-workout-log-v1';
  const EXERCISES=['[ARMS] Bicep Barbell Curl','[ARMS] Bicep DB Upward Curl','[ARMS] Bicep DB Hammer Curls','[ARMS] Bicep Pulley Upward Curl','[ARMS] Bicep Curl machine','[ARMS] Tricep Cable Pushdowns','[ARMS] Tricep DB extension','[ARMS] Tricep Machine Pushdowns','[ARMS] Overhead Cable Tricep Extension','[BACK] Barbell upward row','[BACK] Rear Deltoid Machine','[BACK] Overhand Lat Pulldown Machine','[BACK] Underhand Lat Pulldown Machine','[BACK] Cable Row Mid Back Machine','[BACK] Plate-loaded High Row Machine','[BACK] Single-arm Cable Row','[BACK] Assisted Pull-up','[CHEST] DB Chest Benchpress','[CHEST] DB Incline Benchpress','[CHEST] DB Fly Benchpress','[CHEST] Decline Chest Press Machine','[CHEST] Incline Chest press machine','[CHEST] Chest Press Machine','[CHEST] Pectoral Fly Machine','[CHEST] Upward pull (Dual Pulley)','[CHEST] Fly Press Dual Pulley','[CORE] Abs Machine','[CORE] Plank',"[CORE] Captain's Chair Leg Lifts",'[CORE] Trunk Rotation Pulley machine','[LEGS] Seated Leg Press Machine','[LEGS] Inner Thigh Abductor Machine','[LEGS] Outer Thigh Abductor Machine','[LEGS] Leg Curl/Extension Machine','[LEGS] Sumo Squat Machine','[LEGS] Leg Press Squat Machine','[POSTERIOR] Barbell Deadlift','[POSTERIOR] Barbell SUMO Deadlift','[SHOULDERS] Barbell Upright Row','[SHOULDERS] DB Shoulder Press','[SHOULDERS] Lateral Raise Machine','[SHOULDERS] Machine Shoulder Press','[SHOULDERS] DB Shoulder Front Raise','[SHOULDERS] Face Pull','[SHOULDERS] Dumbbell Rear Delt Fly'];
  const defaultPlans=[
    {id:'plan-push',name:'Push',exercises:['Bench Press','Overhead Press','Dumbbell Bench Press','Lateral Raise','Triceps Pushdown']},
    {id:'plan-pull',name:'Pull',exercises:['Deadlift','Lat Pulldown','Barbell Row','Cable Row','Bicep Curl']},
    {id:'plan-legs',name:'Legs',exercises:['Barbell Back Squat','Romanian Deadlift','Leg Press','Hip Thrust']}
  ];
  function load(){
    try {
      const raw=JSON.parse(localStorage.getItem(KEY)||'null');
      if(raw&&Array.isArray(raw.sessions)&&Array.isArray(raw.plans)){
        const cardio=Array.isArray(raw.cardio)?raw.cardio:(Array.isArray(raw.runs)?raw.runs.map(run=>({...run,activity:'Running'})):[]);
        const active=raw.active||null;
        if(active) (active.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(set=>{if(set.reps===''||set.reps==null)set.reps=12;}));
        return {plans:raw.plans,sessions:raw.sessions,cardio,active};
      }
    } catch(e) { console.warn('Could not load saved workout data.'); }
    return {plans:defaultPlans,sessions:[],cardio:[],active:null};
  }
  let state=load(); let currentView='today'; let workoutOriginView='today'; let cardioDateAuto=true; let timerEnd=null; let toastTimer=null;
  const app=document.getElementById('screen');
  function save(){ try { localStorage.setItem(KEY,JSON.stringify(state)); } catch(e){ showToast('Could not save. Check available browser storage space.'); } }
  function id(prefix){ return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
  function esc(value){ return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(value,opts){ const d=new Date(value); if(Number.isNaN(d.getTime())) return 'Date not set'; return new Intl.DateTimeFormat(undefined,opts||{weekday:'short',day:'numeric',month:'short'}).format(d); }
  function n(value){ const x=Number(value); return Number.isFinite(x)?x:0; }
  function volume(session){ return (session.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).filter(s=>s.done).reduce((x,s)=>x+n(s.weight)*n(s.reps),0),0); }
  function completedSets(session){ return (session.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).filter(s=>s.done).length,0); }
  function showToast(text){ const t=document.getElementById('toast'); t.textContent=text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
  function navMarkup(){
    const items=[['today','Today','⌂'],['cardio','Cardio','♡'],['history','History','◷'],['plans','Plans','▤'],['progress','Progress','↗']];
    document.getElementById('desktopNav').innerHTML=items.map(([key,label])=>`<button type="button" class="${currentView===key?'active':''}" data-nav="${key}">${label}</button>`).join('');
    document.getElementById('mobileNav').innerHTML=items.map(([key,label,icon])=>`<button type="button" class="${currentView===key?'active':''}" data-nav="${key}"><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');
  }
  function header(title,subtitle,eyebrow){ return `<div class="view-title" data-glean-id="view-heading"><div class="eyebrow">${esc(eyebrow||'WORKOUT LOG')}</div><h1>${esc(title)}</h1><p>${esc(subtitle||'')}</p></div>`; }
  function statsMarkup(){
    const total=state.sessions.length; const thisWeek=state.sessions.filter(s=>Date.now()-new Date(s.startedAt).getTime()<=7*86400000).length;
    const last=state.sessions.slice().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0];
    return `<div class="stats" data-glean-id="overview-stats"><div class="stat"><strong>${total}</strong><span>Workouts logged</span></div><div class="stat"><strong>${state.cardio.length}</strong><span>Cardio sessions</span></div><div class="stat"><strong>${thisWeek}</strong><span>Workouts past 7 days</span></div><div class="stat"><strong>${last?fmtDate(last.startedAt,{day:'numeric',month:'short'}):'—'}</strong><span>Last workout</span></div></div>`;
  }
  function planRows(){
    if(!state.plans.length) return `<div class="empty"><div class="empty-mark">＋</div><h3>No plans yet</h3><p>Create a routine to start your next session with your usual exercises ready to go.</p><button class="secondary" data-nav="plans" type="button">Create a plan</button></div>`;
    return `<div class="plan-list">${state.plans.map(p=>`<div class="plan-row" data-glean-id="plan-${esc(p.id)}"><div class="plan-info"><h3>${esc(p.name)}</h3><p>${(p.exercises||[]).length} exercises · ${(p.exercises||[]).slice(0,3).map(esc).join(', ')}${p.exercises.length>3?'…':''}</p></div><div class="plan-actions"><button class="primary" type="button" data-action="start-plan" data-id="${esc(p.id)}">Start</button></div></div>`).join('')}</div>`;
  }
  function sessionMarkup(){
    const a=state.active; if(!a) return '';
    const elapsed=Math.max(0,Math.floor((Date.now()-new Date(a.startedAt).getTime())/1000));
    const timer=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):0;
    const timerHtml=timer>0?`<span class="rest-chip" data-glean-id="rest-timer">Rest · ${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')} <button type="button" class="ghost" data-action="stop-timer" aria-label="Stop rest timer">×</button></span>`:'';
    const exercises=a.exercises.map(ex=>{
      const allDone=ex.sets.length>0&&ex.sets.every(s=>s.done);
      const rest=Number(ex.restSeconds)||90;
      const rpeOptions=Array.from({length:10},(_,i)=>i+1).map(v=>`<option value="${v}" ${Number(ex.rpe)===v?'selected':''}>${v}</option>`).join('');
      return `<article class="exercise-card" data-glean-id="exercise-${esc(ex.id)}"><div class="exercise-head"><h3>${esc(ex.name)}</h3><button class="ghost danger" type="button" data-action="remove-exercise" data-exercise="${esc(ex.id)}" aria-label="Remove ${esc(ex.name)}">Remove</button></div><div class="set-list"><div class="set-head"><span>Set</span><span>kg</span><span>Reps</span><span>Done</span></div>${ex.sets.map((s,i)=>`<div class="set-row" data-glean-id="set-${esc(s.id)}"><span class="set-no">${String(i+1).padStart(2,'0')}</span><input class="field" inputmode="decimal" type="number" min="0" step="0.5" placeholder="0" value="${s.weight?esc(s.weight):''}" data-field="weight" data-exercise="${esc(ex.id)}" data-set="${esc(s.id)}" aria-label="${esc(ex.name)} set ${i+1} weight in kilograms"><input class="field" inputmode="numeric" type="number" min="0" step="1" placeholder="0" value="${s.reps!==''&&s.reps!=null?esc(s.reps):12}" data-field="reps" data-exercise="${esc(ex.id)}" data-set="${esc(s.id)}" aria-label="${esc(ex.name)} set ${i+1} reps"><button class="done-toggle ${s.done?'is-done':''}" type="button" data-action="toggle-set" data-exercise="${esc(ex.id)}" data-set="${esc(s.id)}" aria-label="${s.done?'Mark set incomplete':'Mark set complete'}">${s.done?'✓':'○'}</button></div>`).join('')}</div><div class="exercise-effort"><div><label for="rpe-${esc(ex.id)}">Exercise RPE · 1–10</label><div class="subtle effort-hint">${allDone?'Rate your effort after this exercise. 10 = maximum effort.':'Complete all sets to enter RPE.'}</div></div><select id="rpe-${esc(ex.id)}" class="select-field rpe-select" data-field="rpe" data-exercise="${esc(ex.id)}" aria-label="RPE for ${esc(ex.name)}" ${allDone?'':'disabled'}><option value="">${allDone?'Select':'Complete sets first'}</option>${rpeOptions}</select></div><div class="exercise-footer"><button type="button" class="secondary add-set" data-action="add-set" data-exercise="${esc(ex.id)}">＋ Add set</button><label class="rest-setting">Rest<select class="select-field rest-select" data-field="restSeconds" data-exercise="${esc(ex.id)}" aria-label="Rest interval for ${esc(ex.name)}">${[[45,'45 sec'],[60,'1 min'],[75,'1 min 15 sec'],[90,'1 min 30 sec'],[105,'1 min 45 sec'],[120,'2 min']].map(([v,label])=>`<option value="${v}" ${rest===v?'selected':''}>${label}</option>`).join('')}</select></label><span class="subtle set-count">${ex.sets.filter(s=>s.done).length}/${ex.sets.length} complete</span></div></article>`;
    }).join('');
    const done=completedSets(a);
    return `<section class="panel" data-glean-id="active-workout"><div class="session-top"><div><div class="eyebrow">IN PROGRESS</div><input class="session-title" data-field="workout-title" aria-label="Workout name" value="${esc(a.title)}"><div class="subtle" style="font-size:12px;margin-top:6px">Started ${fmtDate(a.startedAt,{hour:'numeric',minute:'2-digit'})} · ${done} set${done===1?'':'s'} logged</div></div><div style="display:grid;justify-items:end;gap:8px"><span class="timer" data-elapsed="">${String(Math.floor(elapsed/3600)).padStart(2,'0')}:${String(Math.floor(elapsed%3600/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}</span>${timerHtml}</div></div><div class="add-exercise-bar" data-glean-id="listed-exercise-picker"><select class="select-field" id="exerciseSelect" aria-label="Choose an exercise">${EXERCISES.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="secondary" type="button" data-action="add-exercise">Add selected</button></div><div class="add-exercise-bar custom-exercise-bar" data-glean-id="custom-exercise-picker"><input class="field" id="customExercise" type="text" maxlength="80" placeholder="Or type an exercise not listed" aria-label="Custom exercise name"><button class="secondary" type="button" data-action="add-custom-exercise">Add custom</button></div>${exercises || `<div class="empty"><div class="empty-mark">＋</div><h3>Add your first exercise</h3><p>Choose an exercise above, then log weight and reps for each set.</p></div>`}<div class="finish-row"><div>${timer>0?`<span class="rest-chip">Rest timer · ${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}</span>`:`<span class="subtle">Tap ○ when a set is complete · timer follows each exercise’s rest setting</span>`}</div><button class="primary" type="button" data-action="finish-workout" ${done===0?'disabled style="opacity:.48;cursor:not-allowed"':''}>Finish workout</button></div><div class="workout-bottom-actions" data-glean-id="workout-back-control"><button class="secondary back-button" type="button" data-action="back-from-workout">← Back</button></div></section>`;
  }
  function recentSessions(limit){
    const sessions=state.sessions.slice().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).slice(0,limit);
    if(!sessions.length) return `<div class="empty"><div class="empty-mark">◷</div><h3>Your log starts here</h3><p>Finished workouts will show up here with your sets, volume and records.</p></div>`;
    return `<div class="list">${sessions.map(s=>`<div class="history-item" data-glean-id="history-${esc(s.id)}"><div><h3>${esc(s.title||'Workout')}</h3><p>${fmtDate(s.startedAt,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${(s.exercises||[]).length} exercises · ${completedSets(s)} sets</p>${s.exercises?.length?`<details class="session-details"><summary>View exercises, sets and RPE</summary><ul>${s.exercises.map(e=>`<li>${esc(e.name)} — ${(e.sets||[]).filter(x=>x.done).map(x=>`${esc(x.weight)} kg × ${esc(x.reps)}`).join(', ')||'No completed sets'} · RPE ${e.rpe?esc(e.rpe):'not recorded'}</li>`).join('')}</ul></details>`:''}</div><div class="history-actions"><div class="history-value">${Math.round(volume(s)).toLocaleString()}<br><span class="subtle" style="font-size:10px;font-weight:500">kg volume</span></div><button class="ghost danger history-delete" type="button" data-action="delete-history" data-id="${esc(s.id)}" aria-label="Delete ${esc(s.title||'workout')} from history">Delete</button></div></div>`).join('')}</div>`;
  }
  function todayView(){
    if(state.active){ app.innerHTML=`<div class="welcome"><div><div class="eyebrow">YOUR TRAINING, YOUR PACE</div><h1>Keep the momentum.</h1><p>Log each working set as you go.</p></div></div>${sessionMarkup()}`; return; }
    const today=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());
    app.innerHTML=`<div class="welcome" data-glean-id="today-intro"><div><div class="eyebrow">${esc(today.toUpperCase())}</div><h1>Ready when you are.</h1><p>A simple log for stronger, more consistent training.</p></div><button class="primary" type="button" data-action="start-empty">＋ Start empty workout</button></div><div class="content-grid"><div class="stack"><section class="panel" data-glean-id="workout-overview"><div class="panel-header"><div><h2>Your training</h2><p class="subtle">A quick look at your recent rhythm.</p></div></div>${statsMarkup()}<div class="panel-header" style="margin-bottom:12px"><h3>Recent workouts</h3><button class="ghost" type="button" data-nav="history">See history →</button></div>${recentSessions(3)}</section><section class="panel" data-glean-id="plan-shortcuts"><div class="panel-header"><div><h2>Start from a plan</h2><p class="subtle">Your exercise list is ready; add weight and reps during the session.</p></div><button class="ghost" type="button" data-nav="plans">All plans →</button></div>${planRows()}</section></div><aside class="stack"><section class="panel" data-glean-id="personal-record-preview"><div class="panel-header"><div><h2>Personal records</h2><p class="subtle">Best completed weight by exercise.</p></div></div>${recordMarkup(3)}<button class="secondary" style="width:100%;margin-top:12px" type="button" data-nav="progress">View progress</button></section></aside></div><section class="panel export-panel" data-glean-id="csv-export-panel"><div class="panel-header"><div><h2>Export training log as CSV</h2><p class="subtle">Export strength sets and cardio entries, optionally by date range.</p></div></div><div class="export-layout"><label>Timeframe<select class="select-field" id="exportRange" aria-label="Choose CSV export timeframe"><option value="all">All time</option><option value="custom">Custom date range</option></select></label><div class="export-dates hidden" id="exportDates"><label class="export-date">From<input class="field" type="date" id="exportFrom" aria-label="Start date"></label><label class="export-date">To<input class="field" type="date" id="exportTo" aria-label="End date"></label></div><button class="primary" type="button" data-action="export-csv-main">Export training log</button></div><p class="subtle export-caption">The selected dates are inclusive. The CSV includes an Activity Type column for strength and cardio entries.</p></section>`;
  }
  function historyView(){
    const totals=cardioTotals();
    app.innerHTML=`${header('Training history','Strength workouts and cardio sessions, kept in one place.','YOUR LOG')}<div class="stats"><div class="stat"><strong>${state.sessions.length}</strong><span>Total workouts</span></div><div class="stat"><strong>${state.cardio.length}</strong><span>Cardio sessions</span></div><div class="stat"><strong>${Math.round(totals.duration)}</strong><span>Cardio time · min</span></div><div class="stat"><strong>${Math.round(state.sessions.reduce((s,x)=>s+volume(x),0)).toLocaleString()}</strong><span>Strength volume · kg</span></div></div><section class="panel" data-glean-id="workout-history"><div class="panel-header"><div><h2>Strength sessions</h2><p class="subtle">Sorted newest first · volume = completed weight × reps</p></div></div>${recentSessions(1000)}</section><section class="panel" style="margin-top:18px" data-glean-id="cardio-history-summary"><div class="panel-header"><div><h2>Cardio sessions</h2><p class="subtle">Running, walking, stairs, hiking, cycling and custom activities.</p></div><button class="ghost" type="button" data-nav="cardio">Add cardio →</button></div>${cardioRows(1000)}</section>`;
  }
  function plansView(){
    app.innerHTML=`${header('Training plans','Save the sessions you repeat, then start logging in one tap.','YOUR ROUTINES')}<section class="panel" data-glean-id="plan-builder"><div class="panel-header"><div><h2>Create a training plan</h2><p class="subtle">Add a name and comma-separated exercise list.</p></div></div><div class="builder"><div class="builder-row"><input id="planName" type="text" maxlength="50" placeholder="Plan name (e.g. Upper body)" aria-label="Training plan name"><input id="planExercises" type="text" maxlength="400" placeholder="Bench Press, Row, Shoulder Press…" aria-label="Exercises, separated by commas"></div><div><button class="primary" type="button" data-action="create-plan">Save plan</button></div></div><div class="notice">Tip: type exercise names separated by commas. You can still add or remove exercises once a workout has started.</div></section><section class="panel" style="margin-top:18px" data-glean-id="saved-plans"><div class="panel-header"><div><h2>Your plans</h2><p class="subtle">Start a workout or remove a plan you no longer use.</p></div></div>${state.plans.length?`<div class="plan-list">${state.plans.map(p=>`<div class="plan-row" data-glean-id="plan-${esc(p.id)}"><div class="plan-info"><h3>${esc(p.name)}</h3><p>${p.exercises.length} exercises · ${p.exercises.map(esc).join(', ')}</p></div><div class="plan-actions"><button class="primary" type="button" data-action="start-plan" data-id="${esc(p.id)}">Start</button><button class="ghost danger icon-btn" type="button" data-action="delete-plan" data-id="${esc(p.id)}" aria-label="Delete ${esc(p.name)}">×</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-mark">▤</div><h3>No saved plans</h3><p>Use the builder above to save your first routine.</p></div>`}</section>`;
  }
  function bestRecords(){
    const records={};
    state.sessions.forEach(s=>(s.exercises||[]).forEach(e=>(e.sets||[]).filter(x=>x.done&&n(x.weight)>0).forEach(set=>{
      const prev=records[e.name]; if(!prev||n(set.weight)>n(prev.weight)) records[e.name]={weight:n(set.weight),reps:n(set.reps),date:s.startedAt};
    })));
    return Object.entries(records).sort((a,b)=>b[1].weight-a[1].weight);
  }
  function recordMarkup(limit){
    const records=bestRecords().slice(0,limit===undefined?100:limit);
    if(!records.length) return `<div class="empty"><div class="empty-mark">↗</div><h3>No records yet</h3><p>Complete a set with a weight logged and your best lift will appear here.</p></div>`;
    return `<div class="record-list">${records.map(([name,r])=>`<div class="record-row" data-glean-id="record-${esc(name.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}"><div><span class="record-name">${esc(name)}</span><span class="record-meta">${r.reps} reps · ${fmtDate(r.date,{day:'numeric',month:'short',year:'numeric'})}</span></div><div class="record-weight">${r.weight}<small> kg</small></div></div>`).join('')}</div>`;
  }
  function progressView(){
    const totals=cardioTotals();
    const running=state.cardio.filter(c=>cardioName(c)==='Running');
    const runningDistance=running.reduce((sum,c)=>sum+n(c.distanceKm),0);
    app.innerHTML=`${header('Progress','Strength records and cardio totals in one view.','GETTING STRONGER')}<div class="stats"><div class="stat"><strong>${state.sessions.length}</strong><span>Workouts logged</span></div><div class="stat"><strong>${state.cardio.length}</strong><span>Cardio sessions</span></div><div class="stat"><strong>${Math.round(totals.duration)}</strong><span>Cardio time · min</span></div><div class="stat"><strong>${runningDistance.toFixed(1)}</strong><span>Running distance · km</span></div></div><section class="panel" data-glean-id="all-personal-records"><div class="panel-header"><div><h2>Personal records</h2><p class="subtle">Heaviest completed set recorded per exercise. Values are not estimated one-rep maxes.</p></div></div>${recordMarkup()}<hr class="rule"><div class="notice">Records use the highest completed weight per exercise. If you train with dumbbells, enter the load the same way each time (per dumbbell or total) for a consistent comparison.</div></section><section class="panel" style="margin-top:18px" data-glean-id="cardio-progress-summary"><div class="panel-header"><div><h2>Cardio progress</h2><p class="subtle">Recent sessions; pace or speed appears when distance is logged.</p></div><button class="ghost" type="button" data-nav="cardio">Open cardio log →</button></div>${cardioRows(5)}</section>`;
  }
  function render(){ navMarkup(); if(currentView==='today') todayView(); else if(currentView==='cardio') cardioView(); else if(currentView==='history') historyView(); else if(currentView==='plans') plansView(); else progressView(); }
  function newSet(weight=''){return {id:id('set'),weight,reps:12,done:false};}
  function startWorkout(plan){
    workoutOriginView=currentView;
    const exercises=(plan?.exercises||[]).map(name=>({id:id('exercise'),name,rpe:'',restSeconds:90,sets:[newSet(),newSet(),newSet()]}));
    state.active={id:id('workout'),title:plan?.name||'Workout',startedAt:new Date().toISOString(),exercises};
    timerEnd=null; save(); currentView='today'; render(); showToast('Workout started. Let’s get to it.');
  }
  function finishWorkout(){
    if(!state.active||completedSets(state.active)===0) return;
    const finished={...state.active,finishedAt:new Date().toISOString()}; state.sessions.push(finished); state.active=null; timerEnd=null; save(); currentView='history'; render(); showToast('Workout saved to your history.');
  }
  function localDateValue(){ const d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); }
  function syncCardioDate(){ if(currentView==='cardio'&&cardioDateAuto){const field=document.getElementById('cardioDate');if(field)field.value=localDateValue();} }
  function paceLabel(value){ if(!Number.isFinite(Number(value))||Number(value)<=0) return '—'; const seconds=Math.round(Number(value)*60); return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')} /km`; }
  function cardioName(entry){ return String(entry.activity||entry.type||'Running'); }
  function cardioTotals(){ return state.cardio.reduce((out,c)=>{out.distance+=n(c.distanceKm);out.duration+=n(c.durationMinutes);return out;},{distance:0,duration:0}); }
  function cardioMetric(activity,distance,duration){
    if(activity==='Stair climbing'||!(distance>0&&duration>0)) return '';
    return activity==='Cycling'?`${(distance*60/duration).toFixed(1)} km/h`:paceLabel(duration/distance);
  }
  function cardioRows(limit){
    const items=state.cardio.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,limit);
    if(!items.length) return `<div class="empty"><div class="empty-mark">♡</div><h3>No cardio logged yet</h3><p>Add a session to track your duration and, when available, distance.</p><button class="secondary" type="button" data-nav="cardio">Log cardio</button></div>`;
    return `<div class="list">${items.map(c=>{const name=cardioName(c); const metric=cardioMetric(name,n(c.distanceKm),n(c.durationMinutes)); return `<div class="history-item" data-glean-id="cardio-${esc(c.id)}"><div><h3>${esc(name)}</h3><p>${fmtDate(c.date+'T12:00:00',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${n(c.durationMinutes).toFixed(1)} min${n(c.distanceKm)>0?` · ${n(c.distanceKm).toFixed(2)} km`:''}${c.floors!==''&&c.floors!=null?` · ${esc(c.floors)} floors`:''}${c.rpe?` · RPE ${esc(c.rpe)}`:''}${metric?` · ${metric}`:''}</p>${c.notes?`<p class="cardio-notes">${esc(c.notes)}</p>`:''}</div><div class="history-actions"><div class="history-value">${n(c.durationMinutes).toFixed(1)}<br><span class="subtle" style="font-size:10px;font-weight:500">min</span></div><button class="ghost danger history-delete" type="button" data-action="delete-cardio" data-id="${esc(c.id)}" aria-label="Delete ${esc(name)} entry">Delete</button></div></div>`;}).join('')}</div>`;
  }
  function cardioView(){
    cardioDateAuto=true;
    const totals=cardioTotals();
    app.innerHTML=`${header('Cardio','Log running, walking, stairs, hiking, cycling or another activity.','ENDURANCE')}<div class="stats"><div class="stat"><strong>${state.cardio.length}</strong><span>Sessions logged</span></div><div class="stat"><strong>${Math.round(totals.duration)}</strong><span>Total time · min</span></div><div class="stat"><strong>${totals.distance.toFixed(1)}</strong><span>Logged distance · km</span></div><div class="stat"><strong>${state.cardio.filter(c=>{const d=Date.now()-new Date(c.date+'T12:00:00').getTime();return d>=0&&d<=7*86400000;}).length}</strong><span>Past 7 days</span></div></div><section class="panel" data-glean-id="cardio-entry-form"><div class="panel-header"><div><h2>Log cardio</h2><p class="subtle">Duration is required. Distance is optional except for running.</p></div></div><div class="cardio-form-grid"><label>Activity<select class="select-field" id="cardioType" aria-label="Cardio activity"><option>Running</option><option>Incline walk</option><option>Stair climbing</option><option>Hiking</option><option>Cycling</option><option>Other</option></select></label><label>Date<input class="field" type="date" id="cardioDate" value="${localDateValue()}" aria-label="Cardio date"></label><label>Duration · minutes<input class="field" type="number" id="cardioDuration" min="0.1" step="0.1" value="25" placeholder="25" aria-label="Cardio duration in minutes"></label><label id="cardioDistanceField">Distance · km<input class="field" type="number" id="cardioDistance" min="0" step="0.01" placeholder="Optional" aria-label="Cardio distance in kilometres"></label><label id="cardioFloorsField" class="hidden">Floors<input class="field" type="number" id="cardioFloors" min="0" step="1" placeholder="Optional" aria-label="Floors climbed"></label><label>RPE · 1–10<select class="select-field" id="cardioRpe" aria-label="Cardio RPE"><option value="">Select</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label></div><div class="cardio-other hidden" id="cardioOtherField"><label>Specify activity<input class="field" type="text" id="cardioOther" maxlength="80" placeholder="e.g. Rowing, elliptical, swimming" aria-label="Other cardio activity"></label></div><label id="cardioMetricField" style="display:grid;gap:6px;margin-top:11px;color:var(--artifact-text-secondary);font-size:12px;font-weight:650">Pace / speed (calculated when distance is entered)<input class="field" type="text" id="cardioMetricPreview" placeholder="—" aria-label="Calculated pace or speed" readonly></label><label style="display:grid;gap:6px;margin-top:11px;color:var(--artifact-text-secondary);font-size:12px;font-weight:650">Notes<input class="field" type="text" id="cardioNotes" maxlength="240" placeholder="Optional details" aria-label="Cardio notes"></label><div class="cardio-form-actions"><button class="primary" type="button" data-action="save-cardio">Save cardio</button></div></section><section class="panel" style="margin-top:18px" data-glean-id="cardio-history"><div class="panel-header"><div><h2>Cardio log</h2><p class="subtle">Newest entries first.</p></div></div>${cardioRows(1000)}</section>`;
  }
  function updateCardioPreview(){
    const type=document.getElementById('cardioType')?.value||'Running';
    const distance=n(document.getElementById('cardioDistance')?.value);
    const duration=n(document.getElementById('cardioDuration')?.value);
    const preview=document.getElementById('cardioMetricPreview');
    if(preview) preview.value=cardioMetric(type,distance,duration);
  }
  function exportFile(filename,content,type){
    const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
  function exportCsv(fromDate='',toDate=''){
    let sessions=state.sessions.slice(); let cardio=state.cardio.slice();
    if(fromDate&&toDate){
      const start=new Date(fromDate+'T00:00:00'); const end=new Date(toDate+'T23:59:59.999');
      sessions=sessions.filter(s=>{const d=new Date(s.startedAt);return !Number.isNaN(d.getTime())&&d>=start&&d<=end;});
      cardio=cardio.filter(c=>{const d=new Date(c.date+'T12:00:00');return !Number.isNaN(d.getTime())&&d>=start&&d<=end;});
    }
    if(!sessions.length&&!cardio.length){showToast('No training entries found in that timeframe.');return;}
    const rows=[['Activity Type','Activity date','Activity name','Exercise','Exercise RPE (1-10)','Rest duration (seconds)','Set','Distance (km)','Weight (kg)','Duration (minutes)','Reps','Pace (min/km)','Speed (km/h)','Completed','Notes','Floors','Cardio RPE (1-10)']];
    sessions.forEach(s=>(s.exercises||[]).forEach(e=>(e.sets||[]).forEach((x,i)=>rows.push(['Strength',s.startedAt,s.title,e.name,e.rpe||'',e.restSeconds||90,i+1,'',x.weight,'',x.reps,'','',x.done?'Yes':'No','', '', '']))));
    cardio.forEach(c=>{const activity=cardioName(c);const distance=n(c.distanceKm);const duration=n(c.durationMinutes);rows.push(['Cardio',c.date+'T12:00:00',activity,'','','','',c.distanceKm||'','',duration,'',distance>0&&activity!=='Cycling'?paceLabel(duration/distance):'',distance>0&&activity==='Cycling'?(distance*60/duration).toFixed(1):'','Yes',c.notes||'',c.floors??'',c.rpe??'']);});
    const rangeLabel=fromDate&&toDate?`${fromDate}-to-${toDate}`:'all-time';
    exportFile('setwise-training-log-'+rangeLabel+'-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
    showToast(`CSV exported (${sessions.length} workout${sessions.length===1?'':'s'} and ${cardio.length} cardio session${cardio.length===1?'':'s'}).`);
  }
  function addExercise(name){
    if(!state.active)return; const val=String(name||'').trim(); if(!val)return;
    state.active.exercises.push({id:id('exercise'),name:val,rpe:'',restSeconds:90,sets:[newSet(),newSet(),newSet()]}); save(); render(); showToast(val+' added.');
  }
  document.addEventListener('click',function(e){
    const nav=e.target.closest('[data-nav]'); if(nav){currentView=nav.dataset.nav;render();return;}
    const btn=e.target.closest('[data-action]'); if(!btn)return; const action=btn.dataset.action;
    if(action==='start-empty') startWorkout(null);
    else if(action==='start-plan'){const p=state.plans.find(x=>x.id===btn.dataset.id); if(p)startWorkout(p);}
    else if(action==='add-exercise'){const select=document.getElementById('exerciseSelect'); if(select)addExercise(select.value);}
    else if(action==='add-custom-exercise'){const custom=document.getElementById('customExercise')?.value.trim(); if(custom)addExercise(custom);else showToast('Type an exercise name first.');}
    else if(action==='add-set'){const ex=state.active?.exercises.find(x=>x.id===btn.dataset.exercise); if(ex){ex.sets.push(newSet(ex.sets[0]?.weight||''));save();render();}}
    else if(action==='toggle-set'){
      const ex=state.active?.exercises.find(x=>x.id===btn.dataset.exercise); const s=ex?.sets.find(x=>x.id===btn.dataset.set); if(s){s.done=!s.done;if(s.done){timerEnd=Date.now()+(Number(ex.restSeconds)||90)*1000;}save();render();}
    }
    else if(action==='remove-exercise'){if(state.active){state.active.exercises=state.active.exercises.filter(x=>x.id!==btn.dataset.exercise);save();render();}}
    else if(action==='finish-workout') finishWorkout();
    else if(action==='back-from-workout'){
      if(state.active){
        currentView=workoutOriginView==='plans'?'plans':'history';
        render();
        showToast('Workout remains in progress. Open Today to resume.');
      }
    }
    else if(action==='delete-history'){
      const session=state.sessions.find(x=>x.id===btn.dataset.id);
      if(session && window.confirm('Delete “'+(session.title||'Workout')+'” from your history?')){
        state.sessions=state.sessions.filter(x=>x.id!==session.id); save(); render(); showToast('Workout deleted from history.');
      }
    }
    else if(action==='delete-cardio'){
      const entry=state.cardio.find(x=>x.id===btn.dataset.id);
      if(entry && window.confirm('Delete this '+cardioName(entry)+' entry from your history?')){
        state.cardio=state.cardio.filter(x=>x.id!==entry.id); save(); render(); showToast('Cardio entry deleted.');
      }
    }
    else if(action==='save-cardio'){
      const selected=document.getElementById('cardioType')?.value||'Running';
      const activity=selected==='Other'?(document.getElementById('cardioOther')?.value||'').trim():selected;
      const date=cardioDateAuto?localDateValue():(document.getElementById('cardioDate')?.value||'');
      const rawDistance=selected==='Stair climbing'?'':(document.getElementById('cardioDistance')?.value||'');
      const rawFloors=document.getElementById('cardioFloors')?.value||'';
      const rawRpe=document.getElementById('cardioRpe')?.value||'';
      const rawDuration=document.getElementById('cardioDuration')?.value||'';
      const distance=Number(rawDistance),duration=Number(rawDuration),floors=Number(rawFloors),rpe=Number(rawRpe);
      const notes=(document.getElementById('cardioNotes')?.value||'').trim();
      if(!activity){showToast('Specify the activity for Other.');return;}
      if(!date){showToast('Choose a date.');return;}
      if(!Number.isFinite(duration)||duration<=0){showToast('Enter a duration greater than zero.');return;}
      if(!Number.isFinite(distance)||distance<0){showToast('Distance must be zero or greater.');return;}
      if(selected==='Running'&&distance<=0){showToast('Enter a distance for running.');return;}
      if(selected==='Stair climbing'&&rawFloors!==''&&(!Number.isInteger(floors)||floors<0)){showToast('Floors must be a whole number of zero or greater.');return;}
      if(rawRpe!==''&&(!Number.isInteger(rpe)||rpe<1||rpe>10)){showToast('RPE must be between 1 and 10.');return;}
      state.cardio.push({id:id('cardio'),date,activity,distanceKm:distance||'',durationMinutes:duration,floors:selected==='Stair climbing'&&rawFloors!==''?floors:'',rpe:rawRpe!==''?rpe:'',notes});
      save(); render(); showToast('Cardio session saved.');
    }
    else if(action==='stop-timer'){timerEnd=null;render();}
    else if(action==='create-plan'){
      const name=document.getElementById('planName')?.value.trim(); const raw=document.getElementById('planExercises')?.value||''; const exercises=raw.split(',').map(x=>x.trim()).filter(Boolean);
      if(!name||!exercises.length){showToast('Add a plan name and at least one exercise.');return;}
      state.plans.push({id:id('plan'),name,exercises});save();render();showToast('Plan saved.');
    }
    else if(action==='delete-plan'){state.plans=state.plans.filter(x=>x.id!==btn.dataset.id);save();render();showToast('Plan removed.');}
    else if(action==='export-csv-main'){
      const range=document.getElementById('exportRange')?.value||'all';
      let fromDate='',toDate='';
      if(range==='custom'){
        fromDate=document.getElementById('exportFrom')?.value||'';
        toDate=document.getElementById('exportTo')?.value||'';
        if(!fromDate||!toDate){showToast('Choose both a start and end date.');return;}
        if(fromDate>toDate){showToast('The start date must be on or before the end date.');return;}
      }
      exportCsv(fromDate,toDate);
    }
  });
  
  document.addEventListener('change',function(e){
    const el=e.target;
    if(el.id==='exportRange'){
      document.getElementById('exportDates')?.classList.toggle('hidden',el.value!=='custom');
    } else if(el.matches('[data-field="weight"],[data-field="reps"]')){
      const ex=state.active?.exercises.find(x=>x.id===el.dataset.exercise); const s=ex?.sets.find(x=>x.id===el.dataset.set); if(s){
        s[el.dataset.field]=el.value;
        if(el.dataset.field==='weight'&&ex.sets[0]===s&&el.value!==''){
          ex.sets.slice(1).forEach(set=>{
            if(set.weight===''||set.weight==null){
              set.weight=el.value;
              const input=app.querySelector(`[data-field="weight"][data-set="${set.id}"]`);
              if(input)input.value=el.value;
            }
          });
        }
        save();
      }
    } else if(el.matches('[data-field="rpe"],[data-field="restSeconds"]')){
      const ex=state.active?.exercises.find(x=>x.id===el.dataset.exercise); if(ex){ex[el.dataset.field]=el.value;save();if(el.dataset.field==='restSeconds'){render();}}
    } else if(el.matches('[data-field="workout-title"]')){ if(state.active){state.active.title=el.value.trim()||'Workout';save();} }
  });
  
  document.addEventListener('input',function(e){
    if(e.target.id==='cardioDistance'||e.target.id==='cardioDuration') updateCardioPreview();
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='cardioType'){
      document.getElementById('cardioOtherField')?.classList.toggle('hidden',e.target.value!=='Other');
      const stairs=e.target.value==='Stair climbing';
      document.getElementById('cardioDistanceField')?.classList.toggle('hidden',stairs);
      document.getElementById('cardioFloorsField')?.classList.toggle('hidden',!stairs);
      document.getElementById('cardioMetricField')?.classList.toggle('hidden',stairs);
      updateCardioPreview();
    } else if(e.target.id==='cardioDate'){
      cardioDateAuto=e.target.value===localDateValue();
    }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='planName'||e.target.id==='planExercises')){e.preventDefault();document.querySelector('[data-action="create-plan"]')?.click();} else if(e.key==='Enter'&&e.target.id==='customExercise'){e.preventDefault();document.querySelector('[data-action="add-custom-exercise"]')?.click();} });
  window.addEventListener('focus',syncCardioDate);
  document.addEventListener('visibilitychange',syncCardioDate);
  setInterval(function(){
    syncCardioDate();
    const elapsed=document.querySelector('[data-elapsed]'); if(elapsed&&state.active){const sec=Math.max(0,Math.floor((Date.now()-new Date(state.active.startedAt).getTime())/1000));elapsed.textContent=String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
    if(timerEnd&&Date.now()>=timerEnd){timerEnd=null;showToast('Rest time is up.');if(currentView==='today')render();}
    else if(timerEnd&&currentView==='today'&&state.active){const chip=document.querySelector('[data-glean-id="rest-timer"]');if(chip){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));chip.innerHTML=`Rest · ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')} <button type="button" class="ghost" data-action="stop-timer" aria-label="Stop rest timer">×</button>`;}}
  },1000);
  render();
})();
</script>
<script>
  if(window.GleanBridge){
    window.GleanBridge.postMessage({actionId:'export-pdf',type:'glean-add-menu',metadata:{label:'Export as PDF',icon:'export'}});
    window.GleanBridge.onMessage('action',function(data){if(data.actionId==='export-pdf')window.print();});
  }
  function prepareChartsForPrint(){document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var chart=echarts.getInstanceByDom(el);if(!chart)return;var img=new Image();img.src=chart.getDataURL({type:'png',pixelRatio:2});img.className='print-chart-img';img.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:10;';el.dataset.prevPosition=el.style.position;el.style.position='relative';el.appendChild(img);});}
  function cleanUpAfterPrint(){document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var img=el.querySelector('.print-chart-img');if(!img)return;img.remove();el.style.position=el.dataset.prevPosition||'';delete el.dataset.prevPosition;});}
  window.addEventListener('beforeprint',prepareChartsForPrint);window.addEventListener('afterprint',cleanUpAfterPrint);
</script>

<script>
(function(){
  const manifest = {
    name:"Setwise Workout Log", short_name:"Setwise", start_url:".",
    display:"standalone", background_color:"#0a0b0e", theme_color:"#0a0b0e",
    description:"A mobile-friendly workout log"
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const link = document.createElement("link"); link.rel="manifest";
    link.href = URL.createObjectURL(blob); document.head.appendChild(link);
  } catch(e) {}

  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferredPrompt=e;
    const b=document.getElementById("installBtn"); if(b) b.style.display="";
  });
  document.addEventListener("click", async function(e){
    if(e.target && e.target.id==="installBtn" && deferredPrompt){
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(_) {}
      deferredPrompt=null; e.target.style.display="none";
    }
  });
})();
</script>
